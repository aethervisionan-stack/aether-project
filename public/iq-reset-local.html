<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Reset local IQ · Aether</title>
    <meta name="robots" content="noindex" />
  </head>
  <body style="font-family: system-ui; background: #0b0d12; color: #e8eaef; padding: 2rem">
    <p>Limpando dados locais do Teste de QI…</p>
    <script>
      (function () {
        var CLEAN_URL = "http://localhost:3010/teste-qi";
        var explicit = [
          "professional-iq-test-v4-figures",
          "professional-iq-test-v4-questions",
          "professional-iq-test-v4-hybrid",
          "professional-iq-test-v3",
          "professional-iq-test-v3-figures",
          "professional-iq-test-v3-questions",
          "professional-iq-test-v3-hybrid",
          "professional-iq-test-v2",
          "professional-iq-test-v1",
          "professional-iq-leaderboard-v1",
          "professional-iq-leaderboard-current-v1",
          "isUnlocked",
          "archetypeQuizSession_v3",
          "archetypeQuizSession_v2",
          "iq_pix_pending",
          "iq_infinitepay_pending",
        ];

        function isIqKey(k) {
          if (!k) return false;
          var lower = k.toLowerCase();
          return (
            k.indexOf("professional-iq") === 0 ||
            k === "isUnlocked" ||
            k.indexOf("archetypeQuizSession") === 0 ||
            lower.indexOf("unlock") !== -1 ||
            k.indexOf("iq-test") !== -1 ||
            k.indexOf("iq_") !== -1 ||
            lower.indexOf("iq") !== -1 ||
            lower.indexOf("infinitepay") !== -1
          );
        }

        function wipeStore(store) {
          var removed = [];
          try {
            var keys = [];
            for (var i = 0; i < store.length; i++) {
              var k = store.key(i);
              if (k) keys.push(k);
            }
            keys.forEach(function (k) {
              if (isIqKey(k)) {
                store.removeItem(k);
                removed.push(k);
              }
            });
            explicit.forEach(function (k) {
              if (store.getItem(k) != null) {
                store.removeItem(k);
                if (removed.indexOf(k) === -1) removed.push(k);
              }
            });
          } catch (e) {
            /* ignore */
          }
          return removed;
        }

        function remainingIqKeys(store) {
          var left = [];
          try {
            for (var i = 0; i < store.length; i++) {
              var k = store.key(i);
              if (isIqKey(k)) left.push(k);
            }
          } catch (e) {
            /* ignore */
          }
          return left;
        }

        try {
          var removedLs = wipeStore(localStorage);
          wipeStore(localStorage); // second pass
          var removedSs = wipeStore(sessionStorage);
          wipeStore(sessionStorage);
          try {
            sessionStorage.removeItem("iq_pix_pending");
            sessionStorage.removeItem("iq_infinitepay_pending");
          } catch (e2) {
            /* ignore */
          }

          var leftLs = remainingIqKeys(localStorage);
          var leftSs = remainingIqKeys(sessionStorage);
          if (leftLs.length || leftSs.length) {
            leftLs.forEach(function (k) {
              localStorage.removeItem(k);
            });
            leftSs.forEach(function (k) {
              sessionStorage.removeItem(k);
            });
            leftLs = remainingIqKeys(localStorage);
            leftSs = remainingIqKeys(sessionStorage);
          }

          document.body.innerHTML =
            "<p>OK — localStorage removidas: " +
            removedLs.length +
            "; sessionStorage: " +
            removedSs.length +
            ".</p><p>Restantes IQ: ls=" +
            leftLs.length +
            " ss=" +
            leftSs.length +
            "</p><p>Abrindo landing limpa…</p>";

          // Exact clean URL — no session_id / transaction / reset query.
          setTimeout(function () {
            location.replace(CLEAN_URL);
          }, 250);
        } catch (e) {
          document.body.innerHTML =
            "<p>Falha ao limpar: " + String(e) + "</p>";
        }
      })();
    </script>
  </body>
</html>
